// Init script of bootstrap.sh: one task in each project that resolves the external modules of
// the classpaths that the IntelliJ Gradle sync reads (compile and runtime classpath of each
// source set, and the Kotlin compiler plugins). With -PresolvedModulesDir=<dir> each task also
// writes the resolved modules (group:module:version) of its project into <dir>. The task builds
// no project jar and changes no file of the product.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

allprojects {
    tasks.register("resolveDependenciesForIde") {
        def wanted = project.configurations.matching { c ->
            c.canBeResolved && (c.name ==~ /(.*C|c)ompileClasspath|(.*R|r)untimeClasspath|kotlinCompilerPluginClasspath.*/)
        }
        def outDir = project.findProperty("resolvedModulesDir")
        def projectPath = project.path
        doLast {
            def modules = new TreeSet<String>()
            wanted.each { c ->
                c.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        modules << "${id.group}:${id.module}:${id.version}".toString()
                    }
                }
                c.incoming.artifactView { v ->
                    v.componentFilter { id -> id instanceof ModuleComponentIdentifier }
                }.files.files
            }
            if (outDir) {
                def name = projectPath == ":" ? "root" : projectPath.substring(1).replace(':', '_')
                new File(outDir.toString(), name + ".txt").text = modules.join("\n") + "\n"
            }
            println "${projectPath}: ${wanted.size()} configurations, ${modules.size()} modules"
        }
    }
}
